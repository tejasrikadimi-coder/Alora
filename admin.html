<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | KAFA Dairy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f6f6f6;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        #logoutBtn {
            background: #b68b00;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #b68b00;
            color: white;
        }

        #message {
            text-align: center;
            margin-top: 40px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<header>
    <h2>KAFA Dairy Admin</h2>
    <button id="logoutBtn">Logout</button>
</header>

<div class="container">

    <div id="message">Checking admin access...</div>

    <div id="dashboard" style="display:none;">

        <div class="stats">
            <div class="card">
                <h3>Total Orders</h3>
                <h1 id="totalOrders">0</h1>
            </div>
            <div class="card">
                <h3>Total Users</h3>
                <h1 id="totalUsers">0</h1>
            </div>
        </div>

        <div class="card" style="margin-bottom: 30px;">
            <h3>🆕 New Orders - Last 24 Hours</h3>
        
            <table>
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Email</th>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Payment</th>
                        <th>Order Time</th>
                    </tr>
                </thead>
        
                <tbody id="newOrdersTable"></tbody>
            </table>
        </div>
        
        
        <div class="card">
            <h3>Old Orders</h3>
        
            <table>
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Email</th>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Payment</th>
                        <th>Order Time</th>
                    </tr>
                </thead>
        
                <tbody id="oldOrdersTable"></tbody>
            </table>
        </div>

    </div>

</div>

<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signOut
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs,
    query,
    orderBy
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    const firebaseConfig = {
        apiKey: "AIzaSyBFkh9sr1NJwy6HZNbewMkOaKsZsx548S4",
        authDomain: "kafa-dairy-project.firebaseapp.com",
        projectId: "kafa-dairy-project",
        storageBucket: "kafa-dairy-project.firebasestorage.app",
        messagingSenderId: "531794716392",
        appId: "1:531794716392:web:a966bc5a2b3d9146e48b5d"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const message = document.getElementById("message");
    const dashboard = document.getElementById("dashboard");
    const totalOrders = document.getElementById("totalOrders");
    const totalUsers = document.getElementById("totalUsers");
    const newOrdersTable = document.getElementById("newOrdersTable");
    const oldOrdersTable = document.getElementById("oldOrdersTable");

    onAuthStateChanged(auth, async function(user) {

        if (!user) {
            window.location.href = "login.html";
            return;
        }

        const adminRef = doc(db, "admins", user.uid);
        const adminSnap = await getDoc(adminRef);

        if (!adminSnap.exists()) {
            message.textContent = "Access denied. Admin only.";
            return;
        }

        message.style.display = "none";
        dashboard.style.display = "block";

        loadOrders();
        loadUsers();
    });
    async function loadUsers() {

console.log("loadUsers started");

try {

    const usersRef = collection(db, "users");
    const usersSnapshot = await getDocs(usersRef);

    console.log("Users found:", usersSnapshot.size);

    document.getElementById("totalUsers").textContent =
        usersSnapshot.size;

} catch (error) {

    console.error("Users Error:", error);

}
}


    async function loadOrders() {

        try {

            const ordersQuery = query(
    collection(db, "orders"),
    orderBy("createdAt", "desc")
);

const snapshot =
    await getDocs(ordersQuery);
            totalOrders.textContent = snapshot.size;

            newOrdersTable.innerHTML = ""; 
            oldOrdersTable.innerHTML = ""; 
            const now = new Date();

             snapshot.forEach(function(orderDoc) {

                const data = orderDoc.data();
                const orderTime = data.createdAt
    ? data.createdAt.toDate()
    : null;

const hoursDifference = orderTime
    ? (now - orderTime) / (1000 * 60 * 60)
    : 999;

                const row =
                    document.createElement("tr");

                row.innerHTML = `
                    <td>${data.customerName || "-"}</td>
                    <td>${data.userEmail || "-"}</td>
                    <td>${data.product || "-"}</td>
                    <td>${data.quantity || "-"}</td>
                    <td>₹${data.totalPrice || 0}</td>
                    <td>${data.paymentMethod || "-"}</td>
                    <td>${orderTime ? orderTime.toLocaleString() : "-"}</td>
                `;

                if (hoursDifference <= 24) {
                    newOrdersTable.appendChild(row);
                } else {
                    oldOrdersTable.appendChild(row);
                }
            });

        } catch (error) {

            console.error(error);

            message.style.display = "block";
            message.textContent =
                "Could not load orders.";

        }

    }


    document
        .getElementById("logoutBtn")
        .addEventListener(
            "click",
            async function() {

                await signOut(auth);

                window.location.href = "login.html";

            }
        );

</script>

</body>
</html>
