<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alora Handmade Jewelry</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/alora-favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/alora-favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/alora-favicon.png">
    <link rel="shortcut icon" href="favicon.ico">
</head>

<body>
<header class="site-header">

    <a href="index.html" class="logo" aria-label="Alora Handmade Jewelry">
        <img src="assets/alora-logo-transparent.png" alt="Alora Logo" class="logo-mark">
        <span class="logo-text">Alora</span>
    </a>


    <!-- MOBILE MENU -->

    <button
        type="button"
        class="menu-toggle"
        onclick="toggleMenu()"
        aria-label="Open navigation menu">
        ☰
    </button>


    <!-- MAIN NAVIGATION -->

    <nav id="navMenu">
        <a href="index.html">Home</a>
        <a href="collections.html">Collections</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>


    <!-- RIGHT-SIDE ACTIONS -->

    <div class="header-actions">

        <a
            href="wishlist.html"
            class="header-icon-link"
            aria-label="Wishlist">

            <span class="header-icon">♡</span>

            <span
                class="header-count"
                id="wishlistCountBadge">
            </span>

        </a>


        <a
            href="cart.html"
            class="header-icon-link"
            aria-label="Cart">

            <span class="header-icon cart-symbol">🛒</span>

            <span
                class="header-count"
                id="cartCountBadge">
            </span>

        </a>


        <!-- ACCOUNT -->

        <div class="account-menu">

            <button
                type="button"
                class="account-button"
                onclick="toggleAccountMenu(event)"
                aria-label="Account">
                👤
            </button>


           <div
    class="account-dropdown"
    id="accountDropdown">

    <a href="profile.html">
        👤 My Profile
    </a>

    <a href="my-orders.html">
        📦 My Orders
    </a>

</div>

        </div>

    </div>

</header>


<!-- ================= HERO ================= -->

<section class="hero">

    <div class="hero-content">

        <p class="hero-small">
            ALORA HANDMADE JEWELRY
        </p>

        <h1>Luxury Handmade Jewelry</h1>

        <p>
            Crafted with love for every occasion.
        </p>

        <a href="collections.html" class="btn">
            Shop Collection
        </a>

    </div>

</section>


<!-- ================= SEARCH ================= -->

<section class="search">

    <input
        id="search"
        type="search"
        placeholder="Search jewellery..."
        aria-label="Search jewellery">

</section>


<!-- ================= TITLE ================= -->

<section class="section-title">

    <p>OUR COLLECTION</p>

    <h2>Featured Jewelry</h2>

</section>


<!-- ================= PRODUCTS ================= -->
<section
    class="products"
    id="products"
>
    <div class="products-loading">
        Loading jewellery...
    </div>
</section>


<footer>
    © 2026 Alora Handmade Jewelry
</footer>


<script src="script.js"></script>
<script type="module" src="products.js"></script>

</body>
</html>
